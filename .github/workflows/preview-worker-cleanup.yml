name: preview-worker-cleanup

on:
  pull_request:
    types: [closed]
    paths: ['worker/**']

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # Skip on forks — they don't have access to repo secrets
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: worker
      - run: npx wrangler delete --name "bangdream-na-api-pr${{ github.event.pull_request.number }}" --force
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true  # preview may not exist if worker/** wasn't changed in the PR
