name: preview-worker

on:
  pull_request:
    paths: ['worker/**']  # only trigger when worker code changes

permissions:
  contents: read
  pull-requests: write  # for actions/github-script to comment preview URL on PR

jobs:
  preview:
    runs-on: ubuntu-latest
    # Skip on forks — they don't have access to repo secrets
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: worker
      - id: deploy
        run: |
          NAME="bangdream-na-api-pr${{ github.event.pull_request.number }}"
          npx wrangler deploy --name "$NAME"
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "url=https://${NAME}.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev" >> $GITHUB_OUTPUT
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const name = '${{ steps.deploy.outputs.name }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                `**Worker preview deployed:** \`${name}\``,
                ``,
                `Test endpoints:`,
                `- \`curl ${url}/api/healthz\``,
                `- \`curl ${url}/api/news\``,
                ``,
                `> **WARNING: this preview shares the production D1 database and R2 bucket with \`api.bangdream.org\`.**`,
                `> Any write operations (POST/PUT/DELETE via admin endpoints) from this preview **will mutate production data**.`,
                `> **Use read-only testing only** (GET requests, no admin writes).`,
                `> The owner will delete this preview worker when the PR is closed.`
              ].join('\n')
            });
