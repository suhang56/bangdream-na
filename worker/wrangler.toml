name = "bangdream-na-api"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[vars]
GITHUB_CLIENT_ID = "Ov23liBzmTUNtJYieymD"
R2_BUCKET_NAME = "bangdream-na-images"
CDN_ORIGIN = "https://cdn.bangdream.org"
ADMIN_GITHUB_LOGINS = "suhang56"
ALLOWED_ORIGINS = "https://bangdream.org,http://localhost:5173,http://localhost:4173"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "bangdream-na-images"

[[d1_databases]]
binding = "DB"
database_name = "bangdream-na-content"
database_id = "cc268885-f913-4539-8529-70fc0e5e09e9"
migrations_dir = "migrations"

[[routes]]
pattern = "api.bangdream.org"
custom_domain = true

# Secrets set via `wrangler secret put GITHUB_CLIENT_SECRET` and `wrangler secret put JWT_SECRET`
# RESEND_API_KEY set via: cd worker && npx wrangler secret put RESEND_API_KEY
# Optional: EMAIL_FROM_DEFAULT and ADMIN_NOTIFICATION_EMAIL can be added under [vars] for prod overrides.
